<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Summit Climb</title>
<style>
html,body{margin:0;height:100%;background:#07081a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:fixed;left:0;top:0;width:100%;height:100%;display:flex;flex-direction:column;background:#07081a}
#view{position:relative;flex:1 1 auto;min-height:0;width:100%}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#pad{position:absolute;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:12px 16px calc(12px + env(safe-area-inset-bottom));pointer-events:none;box-sizing:border-box}
#stage.portrait #pad{position:relative;flex:none;height:clamp(150px,28vh,230px);align-items:center;background:#07081a;border-top:2px solid #1d2146;pointer-events:auto;padding:0 16px env(safe-area-inset-bottom)}
#stage.portrait .grp{align-items:center}
.grp{display:flex;gap:10px;align-items:flex-end}
.col{display:flex;flex-direction:column;gap:8px}
.btn{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font:700 18px sans-serif;display:flex;align-items:center;justify-content:center;touch-action:none}
.btn.sm{width:44px;height:44px;font-size:14px}
.btn.on{background:rgba(255,255,255,.38)}
#topbar{position:absolute;top:8px;right:8px;display:flex;gap:8px;z-index:5}
.tb{width:40px;height:40px;border-radius:10px;border:2px solid rgba(255,255,255,.4);background:rgba(10,12,40,.55);color:#fff;font:700 18px sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;touch-action:manipulation}
.tb:active,.tb.on{background:rgba(255,255,255,.3)}
#panel{position:absolute;left:0;top:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;background:rgba(4,5,20,.72);z-index:10}
.card{width:min(420px,92%);max-height:90%;overflow:auto;background:#161a3c;border:2px solid #5b66c9;border-radius:14px;padding:16px 18px;color:#e6e9ff;font:14px sans-serif;box-sizing:border-box}
.card h2{margin:0 0 10px;font-size:18px;text-align:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.row input[type=range]{width:50%}
.row select{background:#3a3f6b;color:#fff;border:0;border-radius:6px;padding:5px 8px;font:14px sans-serif}
.sw{-webkit-appearance:none;appearance:none;width:44px;height:24px;border-radius:12px;background:#3a3f6b;position:relative;outline:none;cursor:pointer;margin:0;flex:none}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw:checked{background:#4f6df5}
.sw:checked::after{left:23px}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.acts button{flex:1;min-width:100px;padding:10px 8px;border:0;border-radius:8px;background:#4f6df5;color:#fff;font:700 14px sans-serif;cursor:pointer}
.acts button.sub{background:#3a3f6b}
.note{margin-top:10px;font-size:12px;color:#9aa3d8;text-align:center}
</style>
</head>
<body>
<div id="stage">
<div id="view"><canvas id="c"></canvas></div>
<div id="topbar">
<button class="tb" id="bMute" title="소리">🔊</button>
<button class="tb" id="bRot" title="전체화면 / 가로 모드 (F)">⟳</button>
<button class="tb" id="bSet" title="설정 (ESC)">⚙</button>
</div>
<div id="panel"><div class="card">
<h2>설정</h2>
<div class="row"><span>배경음악</span><input type="checkbox" class="sw" data-s="bgm"></div>
<div class="row"><span>배경음악 볼륨</span><input type="range" min="0" max="100" data-s="bgmVol"></div>
<div class="row"><span>효과음</span><input type="checkbox" class="sw" data-s="sfx"></div>

<div class="row"><span>대시 무한 (보조)</span><input type="checkbox" class="sw" data-s="infDash"></div>
<div class="acts">
<button id="pResume">계속하기</button>
<button class="sub" id="pRetry">스테이지 다시</button>
<button class="sub" id="pTitle">타이틀로</button>
</div>
<div class="note">ESC / P : 설정 · F : 전체화면</div>
</div></div>
<div id="pad">
<div class="grp">
<div class="btn" data-k="left">◀</div>
<div class="btn" data-k="right">▶</div>
<div class="col"><div class="btn sm" data-k="up">▲</div><div class="btn sm" data-k="down">▼</div></div>
</div>
<div class="grp">
<div class="btn" data-k="dash">X</div>
<div class="btn" data-k="jump">Z</div>
</div>
</div>
</div>

function initAudio(){

const AC=window.AudioContext||window.webkitAudioContext;
if(!AC)return;
actx=new AC();
bgmG=actx.createGain();
sfxG=actx.createGain();
bgmG.connect(actx.destination);
sfxG.connect(actx.destination);
const len=actx.sampleRate;
noiseBuf=actx.createBuffer(1,len,actx.sampleRate);
const d=noiseBuf.getChannelData(0);
for(let i=0;i<len;i++)d[i]=Math.random()*2-1;

nextT=actx.currentTime+0.1;

}

function tone(type,f0,f1,dur,vol,delay){
if(!actx)return;
const t=actx.currentTime+(delay||0);
const o=actx.createOscillator(),g=actx.createGain();
o.type=type;
o.frequency.setValueAtTime(f0,t);
if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
g.gain.setValueAtTime(vol,t);
g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
o.connect(g);
g.connect(sfxG);
o.start(t);
o.stop(t+dur+0.02);
}

function noise(dur,vol,f0,f1,delay){
if(!actx)return;
const t=actx.currentTime+(delay||0);
const s=actx.createBufferSource(),fl=actx.createBiquadFilter(),g=actx.createGain();
s.buffer=noiseBuf;
fl.type='bandpass';
fl.frequency.setValueAtTime(f0,t);
fl.frequency.exponentialRampToValueAtTime(f1,t+dur);
g.gain.setValueAtTime(vol,t);
g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
s.connect(fl);
fl.connect(g);
g.connect(sfxG);
s.start(t);
s.stop(t+dur+0.02);
}

function sfx(n){

case 'jump':tone('square',260,520,0.12,0.18);break;

case 'dash':noise(0.22,0.5,3000,500);tone('sawtooth',420,120,0.18,0.12);break;
case 'land':noise(0.07,0.35,500,200);break;
case 'die':tone('sawtooth',380,50,0.35,0.25);noise(0.3,0.4,2500,200);break;
case 'crystal':tone('triangle',880,880,0.1,0.25);tone('triangle',1320,1320,0.18,0.25,0.07);break;
case 'clear':[523,659,784,1047].forEach((f,i)=>tone('square',f,f,0.14,0.16,i*0.07));break;
case 'win':[523,659,784,1047,1319,1568].forEach((f,i)=>tone('square',f,f,0.2,0.16,i*0.1));break;

}
}

function mtof(m){
return 440*Math.pow(2,(m-69)/12);
}

function note(type,m,t,dur,vol){
const o=actx.createOscillator(),g=actx.createGain();
o.type=type;
o.frequency.value=mtof(m);
g.gain.setValueAtTime(0.0001,t);
g.gain.linearRampToValueAtTime(vol,t+0.01);
g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
o.connect(g);
g.connect(bgmG);
o.start(t);
o.stop(t+dur+0.05);
}

function hat(t,vol){
const s=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();
s.buffer=noiseBuf;
f.type='highpass';
f.frequency.value=7000;
g.gain.setValueAtTime(vol,t);
g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
s.connect(f);
f.connect(g);
g.connect(bgmG);
s.start(t);
s.stop(t+0.06);
}

function schedule(){
if(!actx||actx.state!=='running')return;
if(!settings.bgm){nextT=actx.currentTime+0.1;return;}
while(nextT<actx.currentTime+0.2){
if(stepI===0&&curTrack!==pendTrack){curTrack=pendTrack;barI=0;}
const tr=tracks[curTrack];
const chd=tr.ch[barI%4];
const iv=chd[1]?minorIv:majorIv;
const sd=60/tr.bpm/4;
const t=nextT;
if(stepI===0){for(let k=0;k<3;k++)note('sine',chd[0]+iv[k],t,sd*15,0.1);}
if(stepI%8===0)note('triangle',chd[0]-12,t,sd*7,0.32);
if(stepI%2===0){const k=arpIdx[(stepI>>1)%8];note(tr.w,chd[0]+12+(k===3?12:iv[k]),t,sd*1.7,0.045);}
if(stepI%4===2)hat(t,0.05);
nextT+=sd;
stepI++;
if(stepI>=16){stepI=0;barI++;}
}
}

function mk(w,h){
const c=document.createElement('canvas');
c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));
const g=c.getContext('2d');
g.imageSmoothingEnabled=false;
return [c,g];
}

function fq(g,x,y,w,h,ox,oy){
const x0=Math.round((x-ox)*U),y0=Math.round((y-oy)*U);
let x1=Math.round((x+w-ox)*U),y1=Math.round((y+h-oy)*U);
if(x1<=x0)x1=x0+1;
if(y1<=y0)y1=y0+1;
g.fillRect(x0,y0,x1-x0,y1-y0);
}

function fr(g,x,y,w,h){
fq(g,x,y,w,h,0,0);
}

function frl(g,x,y,w,h){
fq(g,x,y,w,h,LXa,LYa);
}

function updateCam(snap){
const visW=cw/K,visH=ch/K;
if(followCam){
const tg=Math.min(Math.max(px+PW/2-visW/2,0),VW-visW);
camX=snap?tg:camX+(tg-camX)*0.12;

camY=-(visH-VH)/2;
}

function hash(a,b){
let n=(Math.imul(a,374761393)+Math.imul(b,668265263))|0;
n=Math.imul(n^(n>>>13),1274126177);
return (((n^(n>>>16))>>>0)%1000)/1000;
}

function hexRgb(c){
return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
}

function mix(a,b,t){
return 'rgb('+Math.round(a[0]+(b[0]-a[0])*t)+','+Math.round(a[1]+(b[1]-a[1])*t)+','+Math.round(a[2]+(b[2]-a[2])*t)+')';
}

function makeBg(th){
[bg,bgG]=mk(cw,ch);
const g=bgG;
const a=hexRgb(th.top),b=hexRgb(th.bot);
const band=Math.max(2,Math.round(4*U));
for(let y=0;y<ch;y+=band){
g.fillStyle=mix(a,b,Math.min(1,y/ch));
g.fillRect(0,y,cw,band);
}
const pp=Math.max(2,Math.round(2*U));
const ns=Math.round(cw*ch/9000);
for(let i=0;i<ns;i++){
const x=Math.floor(hash(i,1)*cw/pp)*pp,y=Math.floor(hash(i,2)*ch*0.6/pp)*pp;
g.fillStyle='rgba(255,255,255,'+(0.3+hash(i,3)*0.6).toFixed(2)+')';
g.fillRect(x,y,pp,pp);
}
const cx=Math.round(th.ox*cw),cy=Math.round(th.oy*ch),r=Math.round(th.or*K*0.9);
g.fillStyle=th.orb;
for(let dy=-r;dy<=r;dy+=pp){
const wd=Math.floor(Math.sqrt(Math.max(0,r*r-dy*dy))/pp)*pp;
g.fillRect(cx-wd,cy+dy,wd*2,pp);
}
const colW=Math.max(2,Math.round(3*U));
const bases=[0.62,0.74,0.86],amps=[0.34,0.24,0.17];
for(let m=0;m<3;m++){
const hs=[];
for(let x=0;x<cw;x+=colW){
const t=x/cw;
let hh=ch*bases[m]-ch*amps[m]*(Math.sin(t*7+m*2)*0.6+Math.sin(t*19+m)*0.3+Math.sin(t*41+m*4)*0.1);
hh=Math.round(hh/pp)*pp;
hs.push(hh);
g.fillStyle=th.m[m];
g.fillRect(x,hh,colW,ch-hh);
}
g.fillStyle='rgba(255,255,255,0.35)';
for(let i=0;i<hs.length;i++){
if(hs[i]<ch*(bases[m]-amps[m]*0.3))g.fillRect(i*colW,hs[i],colW,pp*3);
}
}
}

function solidArt(tx,ty){
const cx=tx<0?0:tx>=W?W-1:tx,cy=ty<0?0:ty>=H?H-1:ty;
return grid[cy*W+cx]===1;
}

function drawStone(g,tx,ty,th){
const ax=tx*32,ay=ty*32;
g.fillStyle=th.base;
frl(g,ax,ay,32,32);
for(let i=0;i<14;i++){
const hx=Math.floor(hash(tx*7+i,ty*3+i*5)*29),hy=Math.floor(hash(ty*11+i,tx*5+i*3)*29);
g.fillStyle=i%3===0?th.light:th.dark;
frl(g,ax+hx,ay+hy,2+(i&1),2);
}
if(hash(tx,ty*7)>0.55){
const cx=Math.floor(hash(ty,tx)*12)+4;
g.fillStyle=th.dark;
frl(g,ax+cx,ay+10,8,1);
frl(g,ax+cx+7,ay+11,1,5);
}
const up=solidArt(tx,ty-1),dn=solidArt(tx,ty+1),lf=solidArt(tx-1,ty),rt=solidArt(tx+1,ty);
g.fillStyle=th.dark;
if(!dn)frl(g,ax,ay+29,32,3);
if(!lf)frl(g,ax,ay,3,32);
if(!rt)frl(g,ax+29,ay,3,32);
if(!up){
g.fillStyle=th.cap;
frl(g,ax,ay,32,6);
g.fillStyle=th.capS;
frl(g,ax,ay+6,32,2);
for(let i=0;i<32;i+=4){
const hh=hash(tx*32+i,ty);
if(hh>0.45)frl(g,ax+i,ay+8,4,hh>0.8?4:2);
}
g.fillStyle='#ffffff';
frl(g,ax+Math.floor(hash(tx,ty+3)*26)+2,ay+1,3,1);
}
}

function makeSpikes(){

const [bc,bgc]=mk(S,S);
const cs=[5,16,27];
for(let k=0;k<3;k++){
for(let r=0;r<24;r++){
const w=2*(1+Math.round(r*4/23));
bgc.fillStyle='#7d1c40';
fr(bgc,cs[k]-w/2-1,8+r,w+2,1);
}
}
for(let k=0;k<3;k++){
for(let r=0;r<24;r++){
const w=2*(1+Math.round(r*4/23));
const x0=cs[k]-w/2;
bgc.fillStyle='#ff7f9e';
fr(bgc,x0,8+r,w,1);
bgc.fillStyle='#ffc2d0';
fr(bgc,x0,8+r,Math.min(2,w),1);
bgc.fillStyle='#d94f75';
fr(bgc,x0+w-2,8+r,2,1);
}
}
const mats=[[1,0,0,1,0,0],[-1,0,0,-1,S,S],[0,1,-1,0,S,0],[0,-1,1,0,0,S]];
spkSprites=[];
for(let d=0;d<4;d++){
const [c,g]=mk(S,S);
g.setTransform(mats[d][0],mats[d][1],mats[d][2],mats[d][3],mats[d][4],mats[d][5]);
g.drawImage(bc,0,0);

function makeCrystal(active){
const S=Math.round(32*U);
const [c,g]=mk(S,S);
for(let i=0;i<28;i++){
const half=i<14?i:27-i;
const w=2*(1+Math.round(half*11/13));
const x0=16-w/2;
if(active){
g.fillStyle='#1e6a8a';
fr(g,x0-1,2+i,w+2,1);
g.fillStyle='#43b5d9';
fr(g,x0,2+i,w/2,1);
g.fillStyle='#8af7ff';
fr(g,x0+w/2,2+i,w/2,1);
}else{
g.fillStyle='rgba(70,170,210,0.4)';
fr(g,x0,2+i,2,1);
fr(g,x0+w-2,2+i,2,1);
if(i===0||i===27)fr(g,x0,2+i,w,1);
}
}
if(active){
g.fillStyle='#ffffff';
fr(g,11,8,3,2);fr(g,10,10,3,2);fr(g,9,12,2,2);
g.fillStyle='#e8ffff';
fr(g,16,6,2,3);
}
return c;
}

function makePlayerSprite(hair,hairD,frame,flip){
const S=Math.round(32*U);
const [c,g]=mk(S,S);
const r=(x,y,w,h,col)=>{g.fillStyle=col;fr(g,x,y,w,h);};
const oy=frame===2?-1:0;
const skin='#ffd3b5',skinD='#e8a98a',coat='#4f6df5',coatD='#3a50c4',coatL='#7f95ff',pants='#2b2d6b',shoe='#e9ecff',shoeD='#aab0dc';
if(frame===3){r(5,13+oy,4,8,hair);r(4,19+oy,4,3,hairD);}

function fmtF(f){

}

function setKey(k,v){
if(v&&!keys[k]){
if(k==='jump')jumpQ=true;
else if(k==='dash')dashQ=true;
}

}

function ovl(ax,ay,aw,ah,b){
return ax<b.x+b.w&&ax+aw>b.x&&ay<b.y+b.h&&ay+ah>b.y;
}

function blockAt(nx,ny){
for(let i=0;i<blocks.length;i++){
const b=blocks[i];
if(nx<b.x+b.w&&nx+PW>b.x&&ny<b.y+b.h&&ny+PH>b.y)return b;
}
return null;
}

function solidAt(tx,ty){
if(tx<0||tx>=W)return true;
if(ty<0||ty>=H)return false;
return grid[ty*W+tx]===1;
}

function tileCollides(nx,ny){
const x0=Math.floor(nx/T),x1=Math.floor((nx+PW-0.01)/T),y0=Math.floor(ny/T),y1=Math.floor((ny+PH-0.01)/T);
for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(solidAt(tx,ty))return true;
return false;
}

function collides(nx,ny){
return tileCollides(nx,ny)||blockAt(nx,ny)!==null;
}

function hitSpike(){
const bx=px+1,by=py+1,bw=PW-2,bh=PH-2;
const x0=Math.floor(bx/T),x1=Math.floor((bx+bw)/T),y0=Math.floor(by/T),y1=Math.floor((by+bh)/T);
for(let ty=y0;ty<=y1;ty++){
for(let tx=x0;tx<=x1;tx++){
if(tx<0||tx>=W||ty<0||ty>=H)continue;
const i=ty*W+tx;
if(grid[i]!==2)continue;
const dr=spkDir[i];
let sx=tx*T,sy=ty*T,sw=T,sh=T;
if(dr===0){sx+=3;sy+=8;sw=T-6;sh=8;}
else if(dr===1){sx+=3;sw=T-6;sh=8;}
else if(dr===2){sy+=3;sw=8;sh=T-6;}
else{sx+=8;sy+=3;sw=8;sh=T-6;}
if(bx<sx+sw&&bx+bw>sx&&by<sy+sh&&by+bh>sy)return true;
}
}
return false;
}

function atExit(){
const tx=Math.floor((px+PW/2)/T),ty=Math.floor((py+PH/2)/T);
if(tx<0||tx>=W||ty<0||ty>=H)return false;
return grid[ty*W+tx]===3;
}

function moveX(dist){
let r=dist;
while(r!==0){
const s=Math.abs(r)>1?Math.sign(r):r;
if(collides(px+s,py)){
if(tileCollides(px+s,py)){
if(s>0)px=Math.floor((px+s+PW-0.01)/T)*T-PW;
else px=(Math.floor((px+s)/T)+1)*T;
}else{
const bk=blockAt(px+s,py);
px=s>0?bk.x-PW:bk.x+bk.w;
}
vx=0;
return;
}
px+=s;r-=s;
}
}

function moveY(dist){
let r=dist;
while(r!==0){
const s=Math.abs(r)>1?Math.sign(r):r;
if(collides(px,py+s)){
if(tileCollides(px,py+s)){
if(s>0)py=Math.floor((py+s+PH-0.01)/T)*T-PH;
else py=(Math.floor((py+s)/T)+1)*T;
}else{
const bk=blockAt(px,py+s);
py=s>0?bk.y-PH:bk.y+bk.h;
}
vy=0;
return;
}
py+=s;r-=s;
}
}

function stepBlocks(){
for(let i=0;i<blocks.length;i++){
const b=blocks[i];
b.t++;
const u=b.t%b.cyc;
let f;
if(u<b.dur)f=u/b.dur;
else if(u<b.dur+b.wait)f=1;
else if(u<2*b.dur+b.wait)f=1-(u-b.dur-b.wait)/b.dur;
else f=0;
f=f*f*(3-2*f);
let mx=Math.round(b.ax+b.dx*f)-b.x,my=Math.round(b.ay+b.dy*f)-b.y;
while(mx!==0){
const s=mx>0?1:-1;
const riding=!ovl(px,py,PW,PH,b)&&ovl(px,py+1,PW,PH,b);
b.x+=s;
if(ovl(px,py,PW,PH,b)){
px+=s;
if(collides(px,py)){die();return true;}
}else if(riding&&!collides(px+s,py))px+=s;
mx-=s;
}
while(my!==0){
const s=my>0?1:-1;
const riding=!ovl(px,py,PW,PH,b)&&ovl(px,py+1,PW,PH,b);
b.y+=s;
if(ovl(px,py,PW,PH,b)){
py+=s;
if(collides(px,py)){die();return true;}
}else if(riding&&s>0&&!collides(px,py+s))py+=s;
my-=s;
}
}
return false;
}

function stepSprings(){
for(let i=0;i<springs.length;i++){
const sp=springs[i];
if(sp.a>0)sp.a--;
if(vy>=0&&px+PW>sp.x+2&&px<sp.x+T-2&&py+PH>sp.y+9&&py<sp.y+T){
vy=-10.4;vx*=0.5;dashT=0;dashes=1;stamina=MAXST;springUp=true;sp.a=10;coyote=0;jumpBuf=0;boost=0;
sfx('jump');shake=2;
spawn(sp.x+4,sp.y+10,-1,-1.2,14,'#ffb0b0',4);
spawn(sp.x+12,sp.y+10,1,-1.2,14,'#ffb0b0',4);
}
}
}

function approach(v,t,a){
return v>t?Math.max(v-a,t):Math.min(v+a,t);
}

function spawn(x,y,sx,sy,life,color,size){
const i=parI;
parI=(parI+1)%PN;
parX[i]=x;parY[i]=y;parVX[i]=sx;parVY[i]=sy;parL[i]=life;parC[i]=color;parS[i]=size;
}

function stepParticles(){
for(let i=0;i<PN;i++){
if(parL[i]>0){
parL[i]--;
parX[i]+=parVX[i];
parY[i]+=parVY[i];
}
}
}

function stepSnow(){
for(let i=0;i<SN;i++){
snY[i]+=snV[i]*1.6*sc/ch;
snX[i]+=(Math.sin(tick*0.02+snP[i])*0.5+0.3)*sc/cw;
if(snY[i]>1){snY[i]=0;snX[i]=hash(i,tick);}
if(snX[i]>1)snX[i]-=1;
}
}

function respawn(){
px=startX;py=startY;vx=0;vy=0;facing=1;wasGround=true;
coyote=0;jumpBuf=0;wallLock=0;dashes=1;dashT=0;deadT=0;dashBuf=0;stamina=MAXST;boost=0;springUp=false;
for(let i=0;i<crystals.length;i++)crystals[i].t=0;
for(let i=0;i<blocks.length;i++){const b=blocks[i];b.t=0;b.x=b.ax;b.y=b.ay;}
for(let i=0;i<springs.length;i++)springs[i].a=0;
for(let i=0;i<berries.length;i++)berries[i].got=false;

function build(i){
grid.fill(0);
crystals.length=0;
exits.length=0;
blocks.length=0;
springs.length=0;
berries.length=0;
const B={
r(x,y,w,h){
for(let ty=y;ty<y+h;ty++)for(let tx=x;tx<x+w;tx++)if(tx>=0&&tx<W&&ty>=0&&ty<H)grid[ty*W+tx]=1;
},
k(x,y,w){
for(let tx=x;tx<x+w;tx++)if(tx>=0&&tx<W&&y>=0&&y<H)grid[y*W+tx]=2;
},
x(x,y,w,h){
exits.push({x:x*T,y:y*T,w:w*T,h:h*T});
for(let ty=y;ty<y+h;ty++)for(let tx=x;tx<x+w;tx++)if(tx>=0&&tx<W&&ty>=0&&ty<H)grid[ty*W+tx]=3;
},
c(x,y){
crystals.push({x:x*T+8,y:y*T+8,t:0});
},
m(x,y,w,h,dx,dy,dur,wait){
blocks.push({ax:x*T,ay:y*T,w:w*T,h:h*T,dx:dx*T,dy:dy*T,dur:dur,wait:wait,cyc:2*(dur+wait),t:0,x:x*T,y:y*T});
},
s(x,y){
springs.push({x:x*T,y:y*T,a:0});
},
b(x,y){
berries.push({x:x*T+8,y:y*T+8,got:false});
},
p(x,gy){
startX=x*T+3;
startY=gy*T-PH;
}
};
levels[i].f(B);
for(let ty=0;ty<H;ty++){
for(let tx=0;tx<W;tx++){
const idx=ty*W+tx;
if(grid[idx]!==2)continue;
let dr=0;
if(ty+1<H&&grid[idx+W]===1)dr=0;
else if(ty>0&&grid[idx-W]===1)dr=1;
else if(tx===0||grid[idx-1]===1)dr=2;
else if(tx===W-1||grid[idx+1]===1)dr=3;
spkDir[idx]=dr;
}
}
}

function buildLayer(th){
const lw=Math.max(1,Math.round((lx1-lx0)*K)),lh=Math.max(1,Math.round((ly1-ly0)*K));
[layer,lg]=mk(lw,lh);
const tx0=Math.floor(lx0/T),tx1=Math.ceil(lx1/T)-1,ty0=Math.floor(ly0/T),ty1=Math.ceil(ly1/T)-1;
for(let ty=ty0;ty<=ty1;ty++){
for(let tx=tx0;tx<=tx1;tx++){
const inside=tx>=0&&tx<W&&ty>=0&&ty<H;
const cx=tx<0?0:tx>=W?W-1:tx,cy=ty<0?0:ty>=H?H-1:ty;
const idx=cy*W+cx;
const v=grid[idx];
if(v===1)drawStone(lg,tx,ty,th);
else if(v===2&&inside)lg.drawImage(spkSprites[spkDir[idx]],Math.round((tx*T-lx0)*K),Math.round((ty*T-ly0)*K));
}
}
}

try{localStorage.setItem('summit-best',JSON.stringify(best));}catch(e){}

endA='DEATH '+deaths+'   TIME '+fmtTime()+'   BERRY '+berryTotal+'/'+berryMax;

function update(){
const jumpP=jumpQ,dashP=dashQ;
jumpQ=false;dashQ=false;
if(dashP)dashBuf=10;
tick++;
if(shake>0)shake--;
stepParticles();
if(settings.snow)stepSnow();
if(state===3){
if(jumpP||dashP){state=0;deaths=0;frames=0;berryTotal=0;goLevel(0);sfx('start');}
return;
}
if(state===2){
if(jumpP||dashP){state=3;setTrack(0);sfx('ui');}
return;
}
if(introT>0)introT--;
if(freeze>0){freeze--;return;}
if(deadT>0){
deadT--;
if(deadT===0)respawn();
return;
}
if(!dashP&&dashBuf>0)dashBuf--;
frames++;
if(frames%6===0)updateHud();
if(tick%10===0){
for(let i=0;i<exits.length;i++){
const ex=exits[i];
spawn(ex.x+Math.random()*ex.w,ex.y+ex.h,0,-0.7,44,'#ffe9a0',4);
}
}

if(stepBlocks())return;
const ix=(keys.right?1:0)-(keys.left?1:0);
const iy=(keys.down?1:0)-(keys.up?1:0);
const ground=collides(px,py+1);
if(ground&&!wasGround){
sfx('land');
spawn(px+2,py+PH,-0.8,-0.4,14,'#cfd6ff',4);
spawn(px+8,py+PH,0.8,-0.4,14,'#cfd6ff',4);
}
wasGround=ground;
onGround=ground;
if(ground){
coyote=6;
if(dashT<=0)dashes=1;
stamina=MAXST;
}else if(coyote>0)coyote--;
if(jumpP)jumpBuf=6;
else if(jumpBuf>0)jumpBuf--;
const wallL=collides(px-3,py),wallR=collides(px+3,py);

if(dashBuf>0&&dashes>0&&dashT<=0){
dashBuf=0;
let dx=ix,dy=iy;
if(dx===0&&dy===0)dx=facing;
if(dx!==0&&dy!==0){dx*=0.7071;dy*=0.7071;}
dashDx=dx;dashDy=dy;dashT=9;freeze=3;shake=4;
if(!settings.infDash)dashes=0;
sfx('dash');buzz(15);
if(dx!==0)facing=dx>0?1:-1;
}

slideWall=false;
if(dashT>0&&ground&&jumpBuf>0&&dashDx!==0&&dashDy>=0){
const dir=dashDx>0?1:-1;
if(dashDy>0){vx=dir*5.6;vy=-3.4;boost=8;}
else{vx=dir*4.4;vy=-6.72;boost=6;}
facing=dir;dashT=0;dashes=1;coyote=0;jumpBuf=0;
sfx('jump');shake=3;
spawn(px+2,py+PH,-1.2,-0.3,14,'#7df9ff',5);
spawn(px+8,py+PH,1.2,-0.3,14,'#7df9ff',5);
}else if(dashT>0){
dashT--;
vx=dashDx*DASH;vy=dashDy*DASH;
if(dashT===0){vx*=0.5;vy*=0.4;}
spawn(px+5,py+7,0,0,14,'#4dc3ff',10);
}else{
if(wallLock>0)wallLock--;
else if(boost>0)boost--;
else if(ix!==0){
facing=ix;
vx=approach(vx,ix*RUN,ground?0.8:0.48);
}else vx=approach(vx,0,ground?0.8:0.19);

if(!ground){
const touching=(wallL&&ix===-1)||(wallR&&ix===1);
if(touching&&wallLock===0&&stamina>0&&!springUp&&(vy>=0||iy<0)){
if(iy<0){vy=-1.2;stamina-=0.76;}
else if(iy>0){vy=2.4;}
else{vy=0;stamina-=0.33;}
slideWall=true;
}else{
let g=0.48;
if(keys.jump&&Math.abs(vy)<1.6)g=0.24;
vy+=g;
const sliding=vy>0&&touching;
slideWall=sliding;
const cap=sliding?1.6:6.7;
if(vy>cap)vy=cap;
}
}else if(vy>0)vy=0;

if(jumpBuf>0){
if(coyote>0){
vy=-6.72;coyote=0;jumpBuf=0;
sfx('jump');
spawn(px+2,py+PH,-0.8,-0.3,12,'#cfd6ff',4);
spawn(px+8,py+PH,0.8,-0.3,12,'#cfd6ff',4);
}else if(wallL||wallR){
const dir=wallL?1:-1;
vx=dir*3.84;vy=-6.24;wallLock=8;facing=dir;jumpBuf=0;
sfx('wall');
spawn(dir>0?px:px+PW,py+7,dir*0.6,-0.2,12,'#cfd6ff',4);
}
}
if(vy>=0)springUp=false;
if(!keys.jump&&vy<-2.4&&!springUp)vy=-2.4;
}

moveX(vx);
moveY(vy);
updateCam(false);

if(py>VH+16||hitSpike()){die();return;}
stepSprings();
for(let i=0;i<berries.length;i++){
const br=berries[i];
if(br.got)continue;
if(Math.abs(px+PW/2-br.x)<12&&Math.abs(py+PH/2-br.y)<14){
br.got=true;
sfx('crystal');
for(let k=0;k<10;k++){
const a=k/10*6.2832;
spawn(br.x,br.y,Math.cos(a)*2.4,Math.sin(a)*2.4,22,k%2?'#ff6b8a':'#ffe9a0',5);
}
updateHud();
}
}

for(let i=0;i<crystals.length;i++){
const c=crystals[i];
if(c.t>0){c.t--;continue;}
if(dashes<1&&Math.abs(px+PW/2-c.x)<18&&Math.abs(py+PH/2-c.y)<20){
dashes=1;c.t=180;
sfx('crystal');
for(let k=0;k<8;k++){
const a=k/8*6.2832;
spawn(c.x,c.y,Math.cos(a)*2.2,Math.sin(a)*2.2,18,'#7df9ff',6);
}
}
}

if(atExit()){
bankBerries();
if(lvl+1>=levels.length){finish();sfx('win');}
else{sfx('clear');goLevel(lvl+1);}
}
}

function frame(t){
const dt=Math.min(100,t-last);
last=t;
acc+=dt;
if(paused)acc=0;
else{
const st=STEP*100/settings.speed;
while(acc>=st){update();acc-=st;}
}
draw();
requestAnimationFrame(frame);
}

function resize(){
layout();
}

canvas.addEventListener('pointerdown',()=>{
unlockAudio();
if(!paused&&(state===3||state===2))jumpQ=true;
});

document.addEventListener('keydown',ev=>{
unlockAudio();
if(ev.code==='Escape'||ev.code==='KeyP'){
ev.preventDefault();
if(!ev.repeat){togglePanel();sfx('ui');}
return;
}
if(ev.code==='KeyF'){
ev.preventDefault();
if(!ev.repeat)toggleLandscape();
return;
}
if(paused)return;
const k=keyMap[ev.code];
if(!k)return;
ev.preventDefault();
setKey(k,true);
});
document.addEventListener('keyup',ev=>{
const k=keyMap[ev.code];
